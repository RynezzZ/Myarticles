name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material and plugins
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-glightbox mdx-truly-sane-lists jieba

      - name: Build static site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          mkdir -p /tmp/mkdocs_build/docs
          cp mkdocs.yml /tmp/mkdocs_build/mkdocs.yml
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='mkdocs.yml' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ /tmp/mkdocs_build/docs/
          mkdocs build -f /tmp/mkdocs_build/mkdocs.yml -d /tmp/site
          touch /tmp/site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
